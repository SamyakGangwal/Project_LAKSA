# LAKSA perception profile: the navigation timing profile plus the ZED SDK's
# neural object detection (3-D boxes, tracking) for the learned driver's
# obstacle layer.  MULTI_CLASS_BOX_FAST keeps the Orin Nano's GPU budget for
# NEURAL_LIGHT depth and positional tracking.
/**:
  ros__parameters:
    general:
      grab_resolution: HD720
      grab_frame_rate: 15      # half the GPU work of 30 fps (depth + detection)
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      grab_compute_capping_fps: 0.0
      pub_frame_rate: 15.0
    video: {publish_rgb: true, publish_left_right: false, publish_raw: false, publish_stereo: false}
    depth:
      depth_mode: NEURAL_LIGHT
      depth_stabilization: 1
      depth_confidence: 50     # stricter than the default 95: drop low-confidence (e.g. low-light) depth
      depth_texture_conf: 90
      min_depth: 0.3
      max_depth: 8.0
      publish_depth_map: true
      publish_point_cloud: true
      point_cloud_freq: 10.0      # was 5: up to 0.2 s extra camera lag (1.5 m/s -> 0.3 m)
      point_cloud_res: REDUCED
      voxel_point_cloud: true
      voxel_size_mm: 50.0
    sensors: {sensors_image_sync: false, sensors_pub_rate: 200.0, publish_imu: true, publish_imu_raw: false, publish_mag: false, publish_baro: false}
    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_3
      imu_fusion: true
      map_frame: map
      odometry_frame: odom
      area_memory: false
      reset_odom_with_loop_closure: false
      set_gravity_as_origin: true
      floor_alignment: false
      two_d_mode: false
      publish_odom_pose: true
      publish_pose_cov: true
    mapping: {mapping_enabled: false}
    object_detection:
      od_enabled: true
      detection_model: MULTI_CLASS_BOX_FAST
      allow_reduced_precision_inference: true
      enable_tracking: true
      max_range: 6.0
      prediction_timeout: 0.5
      filtering_mode: NMS3D
    svo: {svo_loop: false, svo_realtime: false, use_svo_timestamps: true, publish_svo_clock: false}
