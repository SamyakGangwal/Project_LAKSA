# Field overrides on top of laksa_bringup/config/nav2_ackermann.yaml for the
# bench/field car, loaded after it by setup/dryrun_bringup.sh.
#
# Route following uses Regulated Pure Pursuit on the planner's Reeds-Shepp
# path.  In an isolated simulation of an 8 x 6 m room (2026-09-28) it reached
# 4/4 goals with no collisions, where MPPI dithered (0/4) and forward-only
# Dubins planning could not turn the car around in the room.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # 0.22 m/s: the drive stalls below ~0.2 m/s (bench 2026-09-28; KarSha's
      # nav2_tonight_overrides.yaml uses the same values).
      desired_linear_vel: 0.22
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.21
      use_cost_regulated_linear_velocity_scaling: false
      # Reverse segments of Reeds-Shepp paths (three-point turns).  Reverse
      # runs at the motor (bench 2026-09-28); starting from standstill is
      # still unreliable in either direction.
      allow_reversing: true
      use_rotate_to_heading: false
      approach_velocity_scaling_dist: 0.6
      min_approach_linear_velocity: 0.21
      max_angular_accel: 3.2

planner_server:
  ros__parameters:
    GridBased:
      motion_model_for_search: REEDS_SHEPP
