learned_driver:
  ros__parameters:
    scan_topic: /laksa/lidar/scan_validated
    # The supervisor's LiDAR Cruise input. Never run lidar_cruise_node.py at the same time.
    command_topic: /laksa/lidar_cruise_cmd_vel
    enabled_topic: /laksa/exploration_enabled
    status_topic: /laksa/exploration_status
    # Policy-side cap and network conditioning input. drive_supervisor still clamps
    # to exploration_max_erpm (1000 eRPM ~= 0.24 m/s); raise both deliberately.
    speed_cap_mps: 0.24
    wheelbase_m: 0.324
    lidar_x_m: 0.31542
    lidar_yaw_rad: 3.141592653589793
    scan_timeout_sec: 0.5
    # Clearance governor, independent of the network: always able to stop this far
    # in front of the bumper, assuming this deceleration and end-to-end latency.
    stop_margin_m: 0.25
    lateral_margin_m: 0.10
    brake_decel_mps2: 1.0
    latency_sec: 0.25
    # Reverse-away recovery when the forward path is blocked (rear corridor is
    # checked with the LiDAR before and during every reverse).
    reverse_enabled: true
    reverse_speed_mps: 0.12
    reverse_time_sec: 2.5
    rear_clearance_m: 0.30
    max_recoveries: 4
