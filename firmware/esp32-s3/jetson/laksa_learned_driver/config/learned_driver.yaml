learned_driver:
  ros__parameters:
    scan_topic: /laksa/lidar/scan_validated
    # The supervisor's LiDAR Cruise input. Never run lidar_cruise_node.py at the same time.
    command_topic: /laksa/lidar_cruise_cmd_vel
    enabled_topic: /laksa/exploration_enabled
    status_topic: /laksa/exploration_status
    # Policy-side cap and network conditioning input. drive_supervisor still clamps
    # to exploration_max_erpm (1000 eRPM ~= 0.24 m/s); raise both deliberately.
    speed_cap_mps: 0.24
    wheelbase_m: 0.324
    lidar_x_m: 0.31542
    lidar_yaw_rad: 3.141592653589793
    scan_timeout_sec: 0.5
    # Clearance governor, independent of the network: always able to stop this far
    # in front of the bumper, assuming this deceleration and end-to-end latency.
    stop_margin_m: 0.18
    # Forward commands are at least this or zero (the drive stalls below ~0.2 m/s).
    # Together with stop_margin_m the car keeps moving until an obstacle is 0.30 m
    # (1 ft) ahead of the bumper, then stops and backs away.
    min_drive_speed_mps: 0.30
    lateral_margin_m: 0.10
    brake_decel_mps2: 1.0
    latency_sec: 0.25
    # Steer around obstacles: when the policy's arc has less than this much free
    # space ahead of the bumper, take the closest steering arc that does.
    avoid_enabled: true
    avoid_clearance_m: 0.60
    # Multi-point turn when every forward arc is blocked: back up, then forward at
    # full opposite lock, repeated (rear corridor checked with the LiDAR while reversing).
    reverse_enabled: true
    reverse_speed_mps: 0.30
    reverse_time_sec: 1.2
    rear_clearance_m: 0.20
    max_recoveries: 8
    turn_clearance_m: 0.20
