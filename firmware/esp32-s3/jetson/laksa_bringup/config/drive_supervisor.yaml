joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false

drive_supervisor:
  ros__parameters:
    # Launch files must opt in explicitly. The release dry-run launch keeps
    # actuation disabled even while exercising controller/arbitration logic.
    autonomy_enabled: false
    actuation_enabled: false
    odom_topic: /laksa/odometry/fused
    map_frame: map
    base_frame: base_footprint
    steering_axis: 2
    forward_axis: 1
    steering_sign: 1.0
    forward_sign: 1.0
    deadzone: 0.15
    a_button: 0
    b_button: 1
    x_button: 2
    y_button: 3
    # Hold A (or the console's HOLD TO RUN) this long before exploration starts.
    # 3 s made every explore start feel slow; 1 s still rules out a brushed button.
    auto_hold_sec: 1.0
    # Physical e-stop (/laksa/estop_hw from Orin pin 15, laksa-estop-bridge).
    # Re-enabled 2026-10-02 with the owner's agreement. It was disabled on
    # 2026-10-01 because it "latched at every start"; the likely cause was a
    # failing Tx battery (Tx boot-looped every ~3.9 s, Rx fell back to STOP).
    # Keep the Tx on USB power or a charged battery. false ignores the Tx.
    hardware_estop_enabled: true
    manual_speed_presets_erpm: [900, 1300, 1500, 2000, 3000]
    default_manual_speed_erpm: 900
    exploration_max_erpm: 1000.0
    # 620 eRPM is 0.1497 m/s with the measured drivetrain conversion.
    navigation_max_erpm: 620.0
    motor_pole_pairs: 2.0
    gear_reduction: 11.82
    wheel_diameter_m: 0.109
    wheelbase_m: 0.324
    max_steering_rad: 0.523
    left_road_wheel_limit_rad: 0.523
    right_road_wheel_limit_rad: 0.288
    publish_rate_hz: 20.0
    joy_timeout_sec: 0.50
    nav_timeout_sec: 0.25
    nav_startup_timeout_sec: 5.0
    # Clear-costmap and Wait recovery steps intentionally publish no Twist.
    # Brake after 0.5 s, but allow the recovery sequence six seconds to resume.
    nav_abort_timeout_sec: 6.0
    state_timeout_sec: 1.0
    scan_timeout_sec: 0.75
    odom_timeout_sec: 0.75
    local_costmap_timeout_sec: 1.0

lidar_cruise:
  ros__parameters:
    # Simulation-tested Ackermann rollout parameters. See jetson/simulation.
    forward_speed_mps: 0.2414
    reverse_speed_mps: 0.2173
    wheelbase_m: 0.324
    lidar_x_m: 0.315
    # The physical RPLIDAR connector faces the rear of the vehicle.
    lidar_yaw_rad: 3.141592653589793
    left_steering_limit_rad: 0.523
    right_steering_limit_rad: 0.288
    horizon_sec: 3.4
    clearance_weight: 3.5
    novelty_weight: 1.5
    continuity_weight: 0.30
    steering_weight: 0.20
    minimum_clearance_m: 0.20
    blocked_before_reverse_sec: 2.0
    reverse_duration_sec: 1.80
    forward_recovery_sec: 2.50
    reverse_distance_m: 0.36
    forward_recovery_yaw_rad: 0.75
    recovery_phase_timeout_sec: 5.0
    reverse_cooldown_sec: 10.0
    scan_timeout_sec: 0.50
    odom_timeout_sec: 0.50

vesc_ackermann_odometry:
  ros__parameters:
    odom_frame: laksa_odom
    base_frame: laksa_base_footprint
    motor_pole_pairs: 2.0
    gear_reduction: 11.82
    wheel_diameter_m: 0.109
    wheelbase_m: 0.324
    servo_reported_limit_rad: 0.523
    left_road_wheel_limit_rad: 0.523
    right_road_wheel_limit_rad: 0.288
    forward_sign: 1.0
    state_timeout_sec: 1.0
    publish_rate_hz: 30.0

frontier_explorer:
  ros__parameters:
    map_topic: /map
    map_frame: map
    base_frame: laksa_base_footprint
    minimum_cluster_cells: 8
    minimum_goal_distance_m: 0.60
    goal_standoff_m: 0.25
    blacklist_radius_m: 0.50
    goal_timeout_sec: 45.0
    completion_stability_sec: 10.0
    maximum_consecutive_failures: 3
